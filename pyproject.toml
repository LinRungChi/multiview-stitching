[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiview-stitching"
version = "0.1.0"
description = "Multi-view image registration, mosaicking and cross-view detection de-duplication"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Rung-Chi Lin"}]
dependencies = ["numpy>=1.22", "opencv-python>=4.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["multiview_stitching*"]
